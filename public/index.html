<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TVShowManiacs</title>
<meta name="description" content="Track the series and movies you watch, know when new episodes drop, and see what your friends are watching.">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --panel-2: #1f232c; --line: #2a2f3a;
    --text: #e8eaf0; --muted: #8b93a7; --accent: #f5c518; --accent-ink: #1a1400;
    --ok: #3ddc84; --warn: #ff7a59; --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  body { padding-inline: 16px; padding-block: 0 48px; max-width: 1080px; margin-inline: auto; }
  a { color: var(--accent); }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); border-radius: 8px; padding: 7px 12px; }
  button:hover { border-color: #3a4150; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.ghost { background: transparent; }
  button.small { padding: 4px 9px; font-size: 13px; }
  button:disabled { opacity: .5; cursor: default; }
  input[type=text], input[type=password], select { font: inherit; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }

  header { display: flex; align-items: center; gap: 14px; padding: 18px 0 12px; flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .3px; }
  header h1 span { color: var(--accent); }
  nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
  nav button { background: transparent; border-color: transparent; color: var(--muted); }
  nav button.active { color: var(--text); background: var(--panel); border-color: var(--line); }

  .search { display: flex; gap: 8px; margin: 8px 0 16px; }
  .search input { flex: 1; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; }
  .panel h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 22px 0; text-align: center; }
  .row { display: flex; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row .grow { flex: 1; min-width: 0; }
  .row .title { font-weight: 600; }
  .row .sub { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .poster { width: 42px; height: 63px; border-radius: 6px; object-fit: cover; background: var(--panel-2); flex: none; }
  .poster.lg { width: 92px; height: 138px; border-radius: 10px; }
  .date-head { font-weight: 600; margin: 14px 0 4px; display: flex; gap: 8px; align-items: baseline; }
  .date-head small { color: var(--muted); font-weight: 400; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
  .badge.today { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .badge.new { background: rgba(61,220,132,.15); color: var(--ok); border-color: rgba(61,220,132,.3); }
  .badge.ended { color: var(--warn); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: transform .1s; }
  .card:hover { transform: translateY(-2px); border-color: #3a4150; }
  .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: var(--panel-2); }
  .card .body { padding: 8px 10px 10px; }
  .card .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .sub { color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 4px; background: var(--panel-2); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .bar.done-ended i { background: #a78bfa; } .bar.done-running i { background: var(--ok); }

  .detail-head { display: flex; gap: 16px; align-items: flex-start; }
  .detail-head h2 { margin: 0 0 4px; font-size: 22px; text-transform: none; letter-spacing: 0; color: var(--text); }
  .detail-head .meta { color: var(--muted); font-size: 14px; }
  .detail-head .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .season { margin-top: 14px; }
  .season-head { display: flex; align-items: center; gap: 10px; padding: 8px 0; cursor: pointer; user-select: none; }
  .season-head h3 { margin: 0; font-size: 15px; flex: 1; }
  .ep { display: grid; grid-template-columns: 26px 44px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
  .ep.future { opacity: .55; }
  .ep .num { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .ep .n { min-width: 0; }
  .ep .n .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ep .n .o { color: var(--muted); font-size: 12px; display: none; }
  .ep .d { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .chk { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--panel-2); display: grid; place-items: center; cursor: pointer; color: transparent; font-size: 14px; }
  .chk.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .ep.future .chk { pointer-events: none; opacity: .4; }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.5); opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  .toast.show { opacity: 1; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 10px; align-items: center; margin: 10px 0; }
  .kv label { color: var(--muted); }
  .help { font-size: 13px; color: var(--muted); }
  .help ol { padding-left: 18px; margin: 6px 0; }
  .split { display: flex; gap: 8px; flex-wrap: wrap; }
  .setup { text-align: center; padding: 40px 16px; }
  .setup h2 { margin-top: 0; }
  .setup input { max-width: 480px; margin: 12px auto; display: block; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
  .seg button { border: 0; border-radius: 0; background: transparent; color: var(--muted); padding: 7px 12px; }
  .seg button.active { background: var(--panel); color: var(--text); }
  .rating { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; font-size: 13px; }
  .rating .star { color: var(--accent); }
  .rating .imdb { background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 700; padding: 1px 4px; border-radius: 3px; letter-spacing: .04em; }
  .strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
  .person { flex: none; width: 84px; text-align: center; cursor: pointer; }
  .person img, .person .ph { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: var(--panel-2); margin: 0 auto 4px; display: block; }
  .person .pn { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .person .pc { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .why { font-size: 11px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.rec .rt { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.7); border-radius: 6px; padding: 2px 6px; font-size: 12px; font-weight: 600; }
  .card.rec { position: relative; }
  .card.rec .tag { position: absolute; top: 6px; left: 6px; background: var(--ok); color: #05210f; border-radius: 6px; padding: 2px 6px; font-size: 11px; font-weight: 700; }
  .grid.six { grid-template-columns: repeat(6, 1fr); }
  .ep .n .t.lnk { cursor: pointer; } .ep .n .t.lnk:hover { color: var(--accent); }
  .still { width: 100%; max-width: 560px; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; background: var(--panel-2); display: block; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 12px 0; }
  .fact { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; }
  .fact .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .fact .v { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .stat { background: var(--panel-2); border-radius: 12px; padding: 14px; }
  .stat .big { font-size: 26px; font-weight: 700; line-height: 1.1; }
  .stat .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .hbar { display: grid; grid-template-columns: 120px 1fr 60px; gap: 10px; align-items: center; padding: 4px 0; font-size: 13px; }
  .hbar .trk { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; } .hbar .trk i { display: block; height: 100%; background: var(--accent); }
  .hbar .val { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .cols { display: flex; align-items: flex-end; gap: 6px; height: 90px; }
  .cols .c { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 3px; font-size: 10px; color: var(--muted); }
  .cols .c i { display: block; width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs button { background: transparent; border-color: transparent; color: var(--muted); }
  .tabs button.active { color: var(--text); background: var(--panel); border-color: var(--line); }
  .card .tag.want { background: #6ea8ff; color: #041530; } .card .tag.seen { background: var(--accent); color: var(--accent-ink); }
  @media (max-width: 800px) { .grid.six { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 600px) {
    .hbar { grid-template-columns: 90px 1fr 50px; }
    .kv { grid-template-columns: 1fr; gap: 4px; }
    .ep { grid-template-columns: 26px 36px 1fr; }
    .ep .d { grid-column: 3; justify-self: start; }
    .poster.lg { width: 72px; height: 108px; }
  }
</style>
</head>
<body>
<header>
  <h1>TVShow<span>Maniacs</span></h1>
  <nav>
    <button data-view="home">Up next</button>
    <button data-view="friends">Friends</button>
    <button data-view="calendar">Calendar</button>
    <button data-view="shows">My shows</button>
    <button data-view="movies">Movies</button>
    <button data-view="space">My space</button>
    <button data-view="settings">Settings</button>
  </nav>
</header>
<main id="app"></main>
<footer class="help" style="text-align:center;margin-top:30px;padding:16px 0;border-top:1px solid var(--line)">
  <span id="syncState"></span> Data from <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a> (not endorsed or certified by TMDB) · where-to-watch by <a href="https://www.justwatch.com" target="_blank" rel="noopener">JustWatch</a> · schedules by <a href="https://www.tvmaze.com" target="_blank" rel="noopener">TVmaze</a> · <a href="/privacy.html">Privacy &amp; credits</a>
</footer>
<div class="toast" id="toast"></div>

<script>
/* ============ storage ============ */
const CFG = Object.assign({ SUPABASE_URL: '', SUPABASE_ANON: '', API: '' }, window.TVSM_CONFIG || {});
for (const k of ['SUPABASE_URL', 'API']) if (!/^https?:\/\//.test(CFG[k] || '')) CFG[k] = ''; else CFG[k] = CFG[k].replace(/\/+$/, '');
const LEGACY_KEY = 'tvshowmaniacs.v1';
const IMG = 'https://image.tmdb.org/t/p/';
let KEY = LEGACY_KEY;                 // becomes tvsm.cache.<user id> after sign-in
let user = null, profile = null;     // Supabase auth user + our profiles row
let state = blank();
function blank() { return { apiKey: '', omdbKey: '', lang: 'en-US', region: 'FR', shows: {}, watched: {}, order: [], trend: null, movies: {}, pools: null, dismissed: [], dismissedM: [], subs: [], provList: null }; }
function normalize(s) { const b = blank(); for (const k in b) if (s[k] === undefined) s[k] = b[k]; return s; }
function loadLocal(key) { try { const s = JSON.parse(localStorage.getItem(key)); if (s && s.shows) return normalize(s); } catch (e) {} return null; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} if (user) scheduleSync(); }

/* ============ helpers ============ */
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => { const d = new Date(); return [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-'); };
const TODAY = todayStr();
const epKey = (s, e) => `${s}-${e}`;
const code = (s, e) => `S${String(s).padStart(2,'0')}E${String(e).padStart(2,'0')}`;
function fmtDate(iso, opts) {
  if (!iso) return 'TBA';
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString(undefined, opts || { weekday: 'short', day: 'numeric', month: 'short' });
}
function relDay(iso) {
  if (!iso) return 'TBA';
  const a = new Date(iso + 'T12:00:00'), b = new Date(TODAY + 'T12:00:00');
  const diff = Math.round((a - b) / 86400000);
  if (diff === 0) return 'Today'; if (diff === 1) return 'Tomorrow'; if (diff === -1) return 'Yesterday';
  if (diff > 1 && diff < 7) return `In ${diff} days`; if (diff < 0 && diff > -7) return `${-diff} days ago`;
  return fmtDate(iso);
}
function localDate(stamp) { const d = new Date(stamp); if (isNaN(d)) return null; return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-'); }
function localTime(stamp) { const d = new Date(stamp); if (isNaN(d)) return ''; return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }); }
function whenHTML(ep) { return ep.at ? `<span class="muted" style="font-weight:400"> · ${localTime(ep.at)}</span>` : ''; }
function airsLine(s) {
  const m = s.maze; if (!m) return '';
  const parts = [];
  if (m.web) parts.push(`Releases on ${esc(m.channel || 'streaming')}`); else if (m.channel) parts.push(`Airs on ${esc(m.channel)}`);
  if (m.days && m.days.length) parts.push(m.days.join(', ') + (m.time ? ` at ${m.time}` : ''));
  if (m.time && m.tz) parts.push(`(${esc(m.tz)} time)`);
  const nxt = upcoming(s)[0];
  const local = nxt && nxt.at ? ` · next one available ${fmtDate(nxt.air)} at ${localTime(nxt.at)} your time` : '';
  return parts.length || local ? `<div class="meta" style="margin-top:4px">🕘 ${parts.join(' ')}${local}</div>` : '';
}
const haveSub = name => (state.subs || []).some(sname => sname.toLowerCase() === (name || '').toLowerCase());
const onMyServices = item => !!(item && item.providers && item.providers.stream.some(x => haveSub(x.name)));
function subsHTML() {
  const list = state.provList && state.provList.region === state.region ? state.provList.list : null;
  if (!list) { loadProviderList(); return '<span class="help">Loading services for ' + esc(regionName()) + '…</span>'; }
  return list.map(pv => `<label class="badge" style="cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;${haveSub(pv.name) ? 'border-color:var(--ok);color:var(--text)' : ''}"><input type="checkbox" value="${esc(pv.name)}" ${haveSub(pv.name) ? 'checked' : ''} style="margin:0">${pv.logo ? `<img src="${IMG}w45${pv.logo}" alt="" style="width:16px;height:16px;border-radius:3px">` : ''}${esc(pv.name)}</label>`).join('');
}
async function loadProviderList() {
  if (loadProviderList.busy) return; loadProviderList.busy = true;
  try { const d = await tmdb('/watch/providers/tv', { watch_region: state.region });
    const list = (d.results || []).filter(x => x.display_priorities && x.display_priorities[state.region] !== undefined).sort((a, b) => a.display_priorities[state.region] - b.display_priorities[state.region]).slice(0, 30).map(x => ({ name: x.provider_name, logo: x.logo_path }));
    // keep any subscription the user already ticked even if it isn't in the top 30
    (state.subs || []).forEach(n => { if (!list.some(x => x.name === n)) list.push({ name: n, logo: null }); });
    state.provList = { region: state.region, list }; save(); if (view.name === 'settings' && $('#subsBox')) $('#subsBox').innerHTML = subsHTML(); }
  catch (e) { if ($('#subsBox')) $('#subsBox').innerHTML = '<span class="help">Could not load the list of services: ' + esc(e.message) + '</span>'; }
  finally { loadProviderList.busy = false; }
}
function providersHTML(s) {
  const p = s.providers; if (!p) return '';
  const chip = x => `<span class="badge" style="display:inline-flex;align-items:center;gap:5px;color:var(--text);${haveSub(x.name) ? 'border-color:var(--ok);background:rgba(61,220,132,.12)' : ''}" title="${haveSub(x.name) ? 'You subscribe to this' : ''}">${x.logo ? `<img src="${IMG}w45${x.logo}" alt="" style="width:16px;height:16px;border-radius:3px">` : ''}${esc(x.name)}${haveSub(x.name) ? ' ✓' : ''}</span>`;
  if (!p.stream.length && !p.rent.length) return `<div class="meta" style="margin-top:6px">📺 No streaming platform listed for ${regionName(p.region)}${s.network ? ` · broadcast on ${esc(s.network)}` : ''}</div>`;
  return `<div class="meta" style="margin-top:6px;display:flex;flex-wrap:wrap;gap:5px;align-items:center">📺 ${p.stream.length ? `Stream on ${p.stream.map(chip).join(' ')}` : ''}${p.rent.length ? `<span class="help">${p.stream.length ? ' · ' : ''}Rent/buy: ${p.rent.slice(0, 3).map(x => esc(x.name)).join(', ')}</span>` : ''}
    <span class="help">(${regionName(p.region)})</span></div>`;
}
let toastT; function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
function isWatched(showId, s, e) { return !!(state.watched[showId] && state.watched[showId][epKey(s, e)]); }
function aired(ep) { return !!ep.air && ep.air <= TODAY; }
function airedEps(show) { return show.eps.filter(aired); }
function progress(show) { const a = airedEps(show); const w = a.filter(ep => isWatched(show.id, ep.s, ep.e)).length; return { watched: w, total: a.length }; }
// Progress bar: purple = up to date & show ended · green = up to date & still running · yellow = behind · empty = not started
function barHTML(s, p, style) {
  const pct = p.total ? Math.round(100 * p.watched / p.total) : 0; const upToDate = p.total > 0 && p.watched === p.total;
  const ended = /Ended|Canceled/.test(s.status || ''); const cls = upToDate ? (ended ? 'done-ended' : 'done-running') : '';
  const title = !p.watched ? 'Not started' : upToDate ? (ended ? 'Up to date · show ended' : 'Up to date · show still running') : `${p.watched}/${p.total} episodes`;
  return `<div class="bar ${cls}" title="${title}"${style ? ` style="${style}"` : ''}><i style="width:${pct}%"></i></div>`;
}
function nextToWatch(show) { return show.eps.find(ep => aired(ep) && !isWatched(show.id, ep.s, ep.e)) || null; }
function upcoming(show) { return show.eps.filter(ep => ep.air && ep.air > TODAY); }

/* ============ TMDB ============ */
async function tmdb(path, params = {}) {
  // Normal mode: go through our Cloudflare Worker (it holds the TMDB key). Fallback: a personal key typed in Settings.
  const key = (state.apiKey || '').trim();
  const viaProxy = !!CFG.API && !key;
  if (!viaProxy && !key) throw new Error('The TMDB proxy is not set up yet — see README step 4 (or add a personal key in Settings)');
  const url = new URL(viaProxy ? CFG.API + '/tmdb' + path : 'https://api.themoviedb.org/3' + path);
  url.searchParams.set('language', state.lang || 'en-US');
  for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
  const headers = { accept: 'application/json' };
  if (!viaProxy) { if (key.startsWith('eyJ')) headers.Authorization = 'Bearer ' + key; else url.searchParams.set('api_key', key); }
  const r = await fetch(url, { headers });
  if (!r.ok) {
    let msg = r.status + ' ' + r.statusText;
    try { const j = await r.json(); if (j.status_message) msg = j.status_message; } catch (e) {}
    throw new Error(msg);
  }
  return r.json();
}
const slim = r => ({ id: r.id, name: r.name, poster: r.poster_path || null, year: (r.first_air_date || '').slice(0, 4), vote: r.vote_average || 0, votes: r.vote_count || 0, pop: r.popularity || 0, over: (r.overview || '').slice(0, 160), genreIds: r.genre_ids || [] });
async function fetchImdbRating(imdbId) {
  const k = (state.omdbKey || '').trim(); if (!imdbId || (!k && !CFG.API)) return null;

  const seen = new Set([id]); const recs = [];
  for (const r of [...(d.recommendations && d.recommendations.results || []), ...(d.similar && d.similar.results || [])]) { if (!seen.has(r.id) && r.poster_path) { seen.add(r.id); recs.push(slimM(r)); } }

/* ============ routing ============ */
let view = { name: 'home' };
function go(name, arg) { view = { name, arg }; navigated = true; render(); window.scrollTo(0, 0); }
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.view));

function render() {
  const navMap = { show: 'shows', episode: 'shows', movie: 'movies', member: 'friends' };
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.view === (navMap[view.name] || view.name)));
  const app = $('#app');
  if (!user) { app.innerHTML = loginHTML(); bindLogin(); return; }
  if (!CFG.API && !state.apiKey && view.name !== 'settings') { app.innerHTML = setupHTML(); bindSetup(); return; }
  // context: movies section searches movies, everything else searches shows; people search is filtered the same way
  const ctx = view.name === 'person' ? (lastCtx || 'tv') : ['movies', 'movie'].includes(view.name) ? 'movie' : 'tv';
  if (ctx !== lastCtx) { searchMode = ctx; lastCtx = ctx; }
  // keep scroll position, the query and the results across re-renders so several items can be ticked in a row
  const y = window.scrollY, q = $('#q') ? $('#q').value : '', res = $('#results') ? $('#results').innerHTML : '';
  app.innerHTML = searchHTML() + ({ home: homeHTML, calendar: calendarHTML, shows: showsHTML, show: showHTML, settings: settingsHTML, person: personHTML, episode: episodeHTML, movies: moviesHTML, movie: movieHTML, space: spaceHTML, friends: friendsHTML, member: memberHTML }[view.name])();
  bindSearch(); bindCommon();
  if (!navigated && q) { $('#q').value = q; $('#results').innerHTML = res; refreshResultButtons($('#results')); bindResultButtons($('#results')); }
  if (!navigated) requestAnimationFrame(() => window.scrollTo(0, y));
  navigated = false;
  if (view.name === 'person') loadPerson();
  if (view.name === 'friends' && !friendsData.loaded) loadFriends();
  if (view.name === 'member' && !(memberData && memberData.username === view.arg)) loadMember();
  if (view.name === 'home') loadFriendsHome();
  if (view.name === 'episode') loadEpisode();
  if (view.name === 'show' && !state.shows[view.arg] && !previewShows[view.arg]) loadPreview();
  if (view.name === 'movie' && !state.movies[view.arg] && !previewMovies[view.arg]) loadPreview();
  if (['home', 'movies', 'show', 'movie', 'shows'].includes(view.name)) loadPools();
}

      const { data, error } = await sb.from('profiles').update(patch).eq('id', user.id).select().maybeSingle();
      if (error || !data) return toast(error && /unique|duplicate/i.test(error.message) ? 'That username is taken' : 'Could not save profile: ' + (error ? error.message : 'no profile row — run schema.sql in Supabase'));

    $('#deleteAccount').onclick = async () => { if (!confirm('Delete your account and everything in it? This cannot be undone.')) return; if (!confirm('Really delete? Export a backup first if you want to keep your lists.')) return;
      const { error } = await sb.rpc('delete_my_account'); if (error) return toast('Could not delete: ' + error.message); localStorage.removeItem(KEY); await sb.auth.signOut(); location.reload(); };
    $('#refreshAll').onclick = () => refreshAll(true);
    $('#export').onclick = () => download(`tvshowmaniacs-backup-${TODAY}.json`, JSON.stringify(state, null, 1), 'application/json');
    $('#ics2').onclick = exportICS;
    $('#undismiss').onclick = () => { state.dismissed = []; state.dismissedM = []; save(); toast('Hidden suggestions will show again'); render(); };
    $('#import').onclick = () => $('#file').click();
    $('#file').onchange = ev => { const f = ev.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!d.shows) throw 0; mergeImport(d); save(); toast('Imported — syncing to your account'); go('home'); } catch (e) { toast('Not a valid backup file'); } }; r.readAsText(f); };
    $('#wipe').onclick = () => { if (confirm('Delete all your shows, movies and progress from your account?')) { const keep = { apiKey: state.apiKey, omdbKey: state.omdbKey, lang: state.lang, region: state.region }; state = Object.assign(blank(), keep); save(); render(); } };
  }
}
function setWatched(id, s, e, on, skipSave) {
  state.watched[id] = state.watched[id] || {};
  if (on) state.watched[id][epKey(s, e)] = Date.now(); else delete state.watched[id][epKey(s, e)];
  if (!skipSave) save();
}
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportICS() {
  const end = addDays(90); const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//TVShowManiacs//EN', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:TVShowManiacs episodes'];
  const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  let n = 0;
  for (const s of Object.values(state.shows)) { if (s.archived) continue;
    for (const ep of s.eps) { if (!ep.air || ep.air < TODAY || ep.air > end) continue; n++;
      const d = ep.air.replace(/-/g, ''); const dn = addDays(Math.round((new Date(ep.air + 'T12:00:00') - new Date(TODAY + 'T12:00:00')) / 86400000) + 1).replace(/-/g, '');
      const t = `${s.name} ${code(ep.s, ep.e)}${ep.name ? ' – ' + ep.name : ''}`.replace(/[\\;,]/g, m => '\\' + m);
      const where = s.providers && s.providers.stream.length ? ' (' + s.providers.stream.map(x => x.name).join(', ') + ')' : (s.network ? ' (' + s.network + ')' : '');
      const desc = (where.trim() + ' ' + (ep.over || '')).trim().replace(/\r?\n/g, ' ').replace(/[\\;,]/g, m => '\\' + m);
      let when;
      if (ep.at && !isNaN(new Date(ep.at))) { const u = new Date(ep.at); const z = u.toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z'; const e2 = new Date(u.getTime() + (ep.runtime || 60) * 60000).toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
        when = [`DTSTART:${z}`, `DTEND:${e2}`, 'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${t}`, 'TRIGGER:PT0M', 'END:VALARM']; }
      else when = [`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${dn}`, 'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${t}`, 'TRIGGER;VALUE=DURATION:PT20H', 'END:VALARM'];
      lines.push('BEGIN:VEVENT', `UID:tvsm-${s.id}-${ep.s}-${ep.e}@tvshowmaniacs`, `DTSTAMP:${stamp}`, ...when, `SUMMARY:${t}`, `DESCRIPTION:${desc}`, 'END:VEVENT');
    } }
  lines.push('END:VCALENDAR');
  if (!n) return toast('No upcoming episodes in the next 90 days');
  download(`tvshowmaniacs-${TODAY}.ics`, lines.join('\r\n'), 'text/calendar');
  toast(`Exported ${n} upcoming episode${n > 1 ? 's' : ''}`);
}

/* ============ import of old local data ============ */
function mergeImport(d) {
  normalize(d);
  for (const id in d.shows) { if (!state.shows[id]) { state.shows[id] = d.shows[id]; if (!state.order.includes(+id)) state.order.push(+id); }
    state.watched[id] = Object.assign({}, d.watched && d.watched[id] || {}, state.watched[id] || {}); }
  for (const id in d.movies) if (!state.movies[id]) state.movies[id] = d.movies[id];
  state.dismissed = [...new Set([...state.dismissed, ...(d.dismissed || [])])]; state.dismissedM = [...new Set([...state.dismissedM, ...(d.dismissedM || [])])];
}

/* ============ auth + sync (Supabase) ============ */
const sb = (CFG.SUPABASE_URL && window.supabase) ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON) : null;
function loginHTML() {
  return `<div class="panel setup">
    <h2>TVShowManiacs</h2>
    <p class="muted" style="max-width:520px;margin:0 auto 18px">Track the series and movies you watch, know exactly when the next episode drops and where to stream it, and see what your friends are watching.</p>
    ${sb ? `<button class="primary" id="googleLogin" style="padding:10px 18px">Continue with Google</button>
    <div class="help" style="margin:14px 0 6px">or get a sign-in link by e-mail</div>
    <div class="split" style="justify-content:center"><input type="text" id="emailLogin" placeholder="you@example.com" style="max-width:280px" autocomplete="email"><button id="emailGo">Send link</button></div>
    <div id="loginMsg" class="help" style="margin-top:10px"></div>`
    : `<div class="help">Sign-in is not configured yet (SUPABASE_URL missing in config.js).</div>`}
    <p class="help" style="margin-top:22px">Free, no ads. <a href="/privacy.html">Privacy &amp; credits</a></p>
  </div>`;
}
function bindLogin() {
  if (!sb) return;
  $('#googleLogin').onclick = async () => { const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + '/' } }); if (error) $('#loginMsg').textContent = error.message; };
  $('#emailGo').onclick = async () => { const email = $('#emailLogin').value.trim(); if (!email) return; const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + '/' } }); $('#loginMsg').textContent = error ? error.message : 'Check your inbox for the sign-in link.'; };
  $('#emailLogin').onkeydown = e => { if (e.key === 'Enter') $('#emailGo').click(); };
}
async function forceSignOut(msg) {
  try { await sb.auth.signOut(); } catch (e) {}
  try { Object.keys(localStorage).filter(k => k.startsWith('tvsm.cache.')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
  user = null; profile = null; state = blank(); navigated = true; render(); if (msg) toast(msg);
}
async function onSignedIn(u) {
  // Make sure the account still exists on the server (a cached session survives the user being deleted in Supabase)
  const { data: chk, error: chkErr } = await sb.auth.getUser();
  if (chkErr || !chk || !chk.user) return forceSignOut('Your session is no longer valid — please sign in again.');
  u = chk.user;
  user = u; KEY = 'tvsm.cache.' + u.id;
  state = loadLocal(KEY) || blank();
  let { data: p } = await sb.from('profiles').select('*').eq('id', u.id).maybeSingle();
  if (!p) p = await createProfile(u);
  profile = p || null;
  try { await loadFromDb(); } catch (e) { toast('Could not load your data: ' + e.message); }
  // one-time import of data saved by the old single-file version in this browser
  const legacy = loadLocal(LEGACY_KEY);
  if (legacy && Object.keys(legacy.shows).length + Object.keys(legacy.movies || {}).length && !Object.keys(state.shows).length && !Object.keys(state.movies).length) {
    if (confirm(`Import the ${Object.keys(legacy.shows).length} shows and ${Object.keys(legacy.movies || {}).length} movies saved in this browser into your account?`)) { mergeImport(legacy); save(); }
    localStorage.removeItem(LEGACY_KEY);
  }
  navigated = true; render(); refreshAll(false);
}
// Normally the database trigger creates the profile at sign-up; this covers users who signed up before it existed.
async function createProfile(u) {
  let base = (u.email || 'user').split('@')[0].toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, 20); if (base.length < 3) base = 'user' + base;
  for (let i = 0; i < 5; i++) {
    const username = i ? base + '_' + Math.random().toString(36).slice(2, 6) : base;
    const { data, error } = await sb.from('profiles').insert({ id: u.id, username, display_name: (u.user_metadata && (u.user_metadata.full_name || u.user_metadata.name)) || base, avatar_url: u.user_metadata && u.user_metadata.avatar_url || null }).select().single();
    if (data) return data;
    if (/foreign key|not present in table/i.test(error.message)) { forceSignOut('This account no longer exists — please sign in again.'); return null; }
    if (!/duplicate|unique/i.test(error.message)) { toast('Could not create your profile: ' + error.message + ' — did you run schema.sql?'); return null; }
  }
  return null;
}
async function loadFromDb() {
  if (profile) { state.region = profile.region || state.region; state.lang = profile.lang || state.lang; state.dismissed = profile.dismissed || []; state.dismissedM = profile.dismissed_m || []; state.subs = profile.subscriptions || []; }
  const [shows, watched, movies] = await Promise.all([
    sb.from('user_shows').select('show_id,data,archived,added_at').eq('user_id', user.id).order('added_at'),
    sb.from('watched_episodes').select('show_id,season,episode,watched_at').eq('user_id', user.id),
    sb.from('user_movies').select('movie_id,data,list,watched_at,added_at').eq('user_id', user.id)]);
  for (const r of [shows, watched, movies]) if (r.error) throw r.error;
  state.shows = {}; state.order = []; state.watched = {}; state.movies = {};
  for (const r of shows.data) { const d = r.data; d.id = r.show_id; d.archived = r.archived; d.added = new Date(r.added_at).getTime(); state.shows[r.show_id] = d; state.order.push(r.show_id); state.watched[r.show_id] = {}; }
  for (const r of watched.data) { (state.watched[r.show_id] = state.watched[r.show_id] || {})[epKey(r.season, r.episode)] = new Date(r.watched_at).getTime(); }
  for (const r of movies.data) { const d = r.data; d.id = r.movie_id; d.list = r.list; d.watchedAt = r.watched_at ? new Date(r.watched_at).getTime() : null; d.added = new Date(r.added_at).getTime(); state.movies[r.movie_id] = d; }
  synced = snapshot();
}
// Sync = diff the current state against the last synced snapshot and write only what changed.
let synced = null, syncTimer = null, syncing = false, syncAgain = false;
const strip = (o, keys) => { const c = { ...o }; keys.forEach(k => delete c[k]); return c; };
function snapshot() {
  const shows = {}; for (const id in state.shows) shows[id] = JSON.stringify(strip(state.shows[id], ['archived', 'added', 'fetched'])) + '|' + (state.shows[id].archived ? 1 : 0);
  const watched = {}; for (const id in state.watched) for (const k in state.watched[id]) watched[id + ':' + k] = state.watched[id][k];
  const movies = {}; for (const id in state.movies) movies[id] = JSON.stringify(strip(state.movies[id], ['list', 'watchedAt', 'added', 'fetched'])) + '|' + state.movies[id].list + '|' + (state.movies[id].watchedAt || '');
  const prof = JSON.stringify([state.region, state.lang, state.dismissed, state.dismissedM, state.subs]);
  return { shows, watched, movies, prof };
}
function scheduleSync() { clearTimeout(syncTimer); syncTimer = setTimeout(runSync, 500); }
async function runSync() {
  if (!user || !sb) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; setSyncState('Saving…');
  try {
    const now = snapshot(); const old = synced || { shows: {}, watched: {}, movies: {}, prof: '' };
    const ops = [];
    const upShows = Object.keys(now.shows).filter(id => now.shows[id] !== old.shows[id]).map(id => ({ user_id: user.id, show_id: +id, data: strip(state.shows[id], ['archived', 'added']), archived: !!state.shows[id].archived, added_at: new Date(state.shows[id].added || Date.now()).toISOString() }));
    const delShows = Object.keys(old.shows).filter(id => !(id in now.shows)).map(Number);
    if (upShows.length) ops.push(sb.from('user_shows').upsert(upShows));
    if (delShows.length) ops.push(sb.from('user_shows').delete().eq('user_id', user.id).in('show_id', delShows));
    const upW = Object.keys(now.watched).filter(k => now.watched[k] !== old.watched[k]).map(k => { const [id, s, e] = k.split(/[:-]/).map(Number); return { user_id: user.id, show_id: id, season: s, episode: e, watched_at: new Date(now.watched[k]).toISOString() }; });
    const delW = Object.keys(old.watched).filter(k => !(k in now.watched)).map(k => k.split(/[:-]/).map(Number));
    if (upW.length) ops.push(sb.from('watched_episodes').upsert(upW));
    for (const [id, s, e] of delW) ops.push(sb.from('watched_episodes').delete().match({ user_id: user.id, show_id: id, season: s, episode: e }));
    const upM = Object.keys(now.movies).filter(id => now.movies[id] !== old.movies[id]).map(id => ({ user_id: user.id, movie_id: +id, data: strip(state.movies[id], ['list', 'watchedAt', 'added']), list: state.movies[id].list, watched_at: state.movies[id].watchedAt ? new Date(state.movies[id].watchedAt).toISOString() : null, added_at: new Date(state.movies[id].added || Date.now()).toISOString() }));
    const delM = Object.keys(old.movies).filter(id => !(id in now.movies)).map(Number);
    if (upM.length) ops.push(sb.from('user_movies').upsert(upM));
    if (delM.length) ops.push(sb.from('user_movies').delete().eq('user_id', user.id).in('movie_id', delM));
    if (now.prof !== old.prof) ops.push(sb.from('profiles').update({ region: state.region, lang: state.lang, dismissed: state.dismissed, dismissed_m: state.dismissedM, subscriptions: state.subs || [] }).eq('id', user.id));
    const results = await Promise.all(ops);
    const err = results.find(r => r && r.error);
    if (err) throw err.error;
    synced = now; setSyncState('');
  } catch (e) { setSyncState('⚠ Not saved: ' + (e.message || e)); console.error('sync', e); setTimeout(scheduleSync, 15000); }
  finally { syncing = false; if (syncAgain) { syncAgain = false; scheduleSync(); } }
}
function setSyncState(t) { const el = $('#syncState'); if (el) el.textContent = t ? t + ' · ' : ''; }
window.addEventListener('beforeunload', () => { if (syncTimer) runSync(); });

/* ============ boot ============ */
if (sb) {
  const routeHash = () => { const h = location.hash.match(/^#u\/([a-z0-9_]+)/i); if (h) { view = { name: 'member', arg: h[1].toLowerCase() }; history.replaceState(null, '', '/'); if (user) { navigated = true; render(); } } };
  routeHash(); window.addEventListener('hashchange', routeHash);
  render();
  sb.auth.getSession().then(({ data }) => { if (data.session) onSignedIn(data.session.user); });
  sb.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_IN' && session && !user) onSignedIn(session.user); if (ev === 'SIGNED_OUT') { user = null; render(); } });
} else { // no backend configured: single-user mode with a personal TMDB key, data in this browser only
  user = { id: 'local' }; state = loadLocal(LEGACY_KEY) || blank(); render(); if (state.apiKey) refreshAll(false);
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
