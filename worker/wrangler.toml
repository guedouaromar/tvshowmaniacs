name = "tvshowmaniacs-api"
main = "src/index.js"
compatibility_date = "2026-06-01"

[vars]
# Origins allowed to call the API. Add your custom domain here later (comma-separated).
ALLOWED_ORIGINS = "https://tvshowmaniacs.netlify.app,https://tvshowmaniacs.pages.dev,http://localhost:8788,http://localhost:8000"

# Secrets are NOT stored here. Set them with:
#   npx wrangler secret put TMDB_TOKEN
#   npx wrangler secret put OMDB_KEY      (optional)
# or in the Cloudflare dashboard: Workers & Pages → tvshowmaniacs-api → Settings → Variables and Secrets
